name: Publish to PyPI
on:
  push:
    tags: ["v*"]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install stapel-core
        run: pip install git+https://github.com/usestapel/stapel-core.git

      - name: Install
        run: pip install -e ".[all]" || pip install -e .

      - name: Lint
        run: |
          pip install ruff --quiet
          ruff check . --select E,F,W --ignore E501

      - name: Import check
        run: python -c "import stapel_workspaces; print('import OK')"

      - name: Install test dependencies
        run: pip install pytest pytest-django pytest-cov "stapel-tools>=0.9.1,<1"

      # Test-only sibling, --no-deps so it cannot pull stapel-core from PyPI
      # over the git-main core installed above. NOT a dependency of this
      # distribution (Stapel modules never import each other) — the roster's
      # name-edit endpoints write the display name stapel-profiles owns
      # through an in-process seam, and no fake proves a real Profile row
      # takes that write. Without it the display-name canon tests skip.
      - name: Install stapel-profiles (test-only sibling for the profiles seam)
        run: pip install --no-deps stapel-profiles

      - name: Tests with coverage
        run: |
          pytest tests/ \
            --cov=stapel_workspaces \
            --cov-report=term-missing \
            --cov-report=xml \
            --junitxml=junit.xml \
            -o junit_family=legacy \
            -v

      # Second session, sibling actually mounted (see _codegen_settings
      # .profiles_co_mounted). Separate because co-mounting registers
      # profiles' error keys into the process-global registry this module's
      # i18n and error-key gates read.
      - name: Profiles seam co-mounted (in-process integration)
        env:
          STAPEL_WORKSPACES_TEST_PROFILES: "1"
        run: pytest tests/test_profiles_comounted.py -v

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        if: ${{ !cancelled() }}
        continue-on-error: true
        with:
          files: coverage.xml
          flags: stapel-workspaces
          token: ${{ secrets.CODECOV_TOKEN }}

      - name: Upload test results to Codecov
        uses: codecov/test-results-action@v1
        if: ${{ !cancelled() }}
        continue-on-error: true
        with:
          token: ${{ secrets.CODECOV_TOKEN }}

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build
        run: |
          pip install build --quiet
          python -m build
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
